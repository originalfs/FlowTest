[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localflow"
version = "0.1.0"
description = "Private, fully local voice dictation: hotkey -> local Whisper -> text at your cursor. No cloud, ever."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pynput>=1.7.6",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
localflow = "localflow.__main__:main"

[tool.setuptools.packages.find]
include = ["localflow*"]
